      operationId: getClassificationRuleList
      parameters:
        - name: X-Request-ID
          in: header
          description: The request ID header consists of the request ID which is returned in the response headers and also appears in the API service logs.
          required: false
          schema:
            type: string
            exampleSetFlag: true
      responses:
        '200':
          description: list of CdpClassificationRuleListResponse objects
