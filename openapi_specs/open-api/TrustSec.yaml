    Condition:
      title: Condition
      required:
        - conditionType
      type: object
      properties:
        conditionType:
          type: string
          description: <ul><li>Inidicates whether the record is the condition itself(data) or a logical(or,and) aggregation</li> <li>Data type enum(reference,single) indicates than "conditonId" OR "ConditionAttrs" fields should contain condition data but not both</li> <li>Logical aggreation(and,or) enum indicates that additional conditions are present under the children field</li></ul>
          example: ConditionAttributes
          exampleSetFlag: true
          enum:
            - ConditionAndBlock
            - ConditionAttributes
            - ConditionOrBlock
            - ConditionReference
            - LibraryConditionAndBlock
            - LibraryConditionAttributes
            - LibraryConditionOrBlock
            - TimeAndDateCondition
        isNegate:
          type: boolean
          description: Indicates whereas this condition is in negate mode
          example: false
          exampleSetFlag: true
        link:
          $ref: '#/components/schemas/Link'
          exampleSetFlag: true
      description: <ul><li>Hierarchical structure which defines a set of conditions for which authentication or authorization policy rules could be matched.</li> <li>Logical operations(AND, OR) relationship between conditions are supported</li> <li>Each condition can have subconditions with relation to logical operations</li></ul>
      exampleSetFlag: false
    ConditionAndBlock:
      title: ConditionAndBlock
      required:
        - children
        - conditionType
      type: object
      properties:
        children:
          type: array
          description: In case type is andBlock or orBlock addtional conditions will be aggregated under this logical (OR/AND) condition
          example: '[{"name":"Radius condition","description":"Match only radius requests","id":"ad947f38-7063-4da2-8723-652e0ca2ea41","conditionType":"ConditionReference","isNegate":false},{"name":"Tacacs condition","description":"Match only tacacs condition","id":"ad947f38-7063-4da2-8723-652e0ca2eb52","conditionType":"ConditionReference","isNegate":false}]'
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/Condition'
            exampleSetFlag: false
        conditionType:
          type: string
          description: <ul><li>Inidicates whether the record is the condition itself(data) or a logical(or,and) aggregation</li> <li>Data type enum(reference,single) indicates than "conditonId" OR "ConditionAttrs" fields should contain condition data but not both</li> <li>Logical aggreation(and,or) enum indicates that additional conditions are present under the children field</li></ul>
          example: ConditionAttributes
          exampleSetFlag: true
          enum:
            - ConditionAndBlock
            - ConditionAttributes
            - ConditionOrBlock
            - ConditionReference
            - LibraryConditionAndBlock
            - LibraryConditionAttributes
            - LibraryConditionOrBlock
            - TimeAndDateCondition
        isNegate:
          type: boolean
          description: Indicates whereas this condition is in negate mode
          example: false
          exampleSetFlag: true
        link:
          $ref: '#/components/schemas/Link'
          exampleSetFlag: true
      description: <ul><li>Hierarchical structure which defines a set of conditions for which authentication or authorization policy rules could be matched.</li> <li>Logical operations(AND, OR) relationship between conditions are supported</li> <li>Each condition can have subconditions with relation to logical operations</li></ul>
