components:
  schemas:
    AciConnection:
      title: AciConnection
      required:
        - hostname
        - name
        - username
      type: object
      properties:
        connMode:
          type: string
          description: Out-of-Band/In-Band
          exampleSetFlag: true
        domain:
          type: string
          description: Auth Domain
          example: Default
          exampleSetFlag: true
        errorReason:
          type: string
          example: error reason
          exampleSetFlag: true
        hostname:
          type: string
          description: ACI hostname or IP address
          example: 10.0.0.1
          exampleSetFlag: true
        id:
          type: string
          readOnly: true
          exampleSetFlag: true
        learnedIPs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionAllOfLearnedIPs'
            exampleSetFlag: false
        name:
          type: string
          description: ACI name
          example: ACI1
          exampleSetFlag: true
        nameConversion:
          $ref: '#/components/schemas/NameConversion'
          exampleSetFlag: true
        password:
          type: string
          description: Password
          example: password1
          exampleSetFlag: true
        selectedEpgs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/Epg'
            exampleSetFlag: false
        sgtRanges:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/SgtRange'
            exampleSetFlag: false
        state:
          type: string
          description: Corresponding actions will change the state of the connection
          readOnly: true
          exampleSetFlag: true
          enum:
            - CONNECT
            - CONNECTING
            - DELETE_ERROR
            - DELETING
            - ERROR
            - SUSPEND
            - UNDEPLOYED
        usedSgtRanges:
          type: array
          description: SGT ranges used by the connection
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/SgtRange'
            exampleSetFlag: false
        username:
          type: string
          description: Username
          example: user1
          exampleSetFlag: true
        validateCertificate:
          type: boolean
          description: ValidationCertificate
          example: false
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionAccessInfo:
      title: AciConnectionAccessInfo
      required:
        - hostname
        - name
        - username
      type: object
      properties:
        domain:
          type: string
          description: Auth Domain
          example: Default
          exampleSetFlag: true
        hostname:
          type: string
          description: ACI hostname or IP address
          example: 10.0.0.1
          exampleSetFlag: true
        id:
          type: string
          description: ID if connection is already created
          exampleSetFlag: true
        name:
          type: string
          description: ACI name
          example: ACI1
          exampleSetFlag: true
        password:
          type: string
          description: Password
          example: password1
          exampleSetFlag: true
        username:
          type: string
          description: Username
          example: user1
          exampleSetFlag: true
        validateCertificate:
          type: boolean
          description: ValidationCertificate
          example: false
          exampleSetFlag: true
      description: ACI connection configuration
      exampleSetFlag: false
    AciConnectionAllOfLearnedIPs:
      title: AciConnectionAllOfLearnedIPs
      type: object
      properties:
        ipaddress:
          type: string
          exampleSetFlag: true
        name:
          type: string
          exampleSetFlag: true
        status:
          type: boolean
          example: false
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionByIdStatusResponse:
      title: AciConnectionByIdStatusResponse
      type: object
      properties:
        response:
          $ref: '#/components/schemas/AciConnectionStatus'
          exampleSetFlag: true
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionResponse:
      title: AciConnectionResponse
      type: object
      properties:
        response:
          $ref: '#/components/schemas/AciConnection'
          exampleSetFlag: true
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionStatus:
      title: AciConnectionStatus
      type: object
      properties:
        errorReason:
          type: string
          description: error reason
          exampleSetFlag: true
        id:
          type: string
          description: aci connection id
          example: 12345678-f0e7-456b-a2d1-876543320123
          exampleSetFlag: true
        name:
          type: string
          description: aci connection name
          example: aci1
          exampleSetFlag: true
        receivedMappingCount:
          type: integer
          description: Inbound Rule mapping count
          format: int32
          exampleSetFlag: true
        status:
          type: string
          exampleSetFlag: true
          enum:
            - CONNECTED
            - DELETE_ERROR
            - DELETING
            - DISCONNECTED
            - ERROR
            - SUSPENDED
            - SUSPENDING
            - UNDEPLOYED
        syncedEpgCount:
          type: integer
          description: count the number of epgs that are synced
          format: int32
          exampleSetFlag: true
      description: ACI Connection status
      exampleSetFlag: false
    AciConnectionStatusResponse:
      title: AciConnectionStatusResponse
      type: object
      properties:
        response:
          type: array
          description: Connection name to be used to filter out the metadata
          example: '["ACI1","ACI2"]'
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionStatus'
            exampleSetFlag: false
        version:
          type: string
          exampleSetFlag: true
      description: List of AciConnectionStatus
      exampleSetFlag: false
    AciConnectionSummary:
      title: AciConnectionSummary
      type: object
      properties:
        domain:
          type: string
          example: default
          exampleSetFlag: true
        errorReason:
          type: string
          example: error reason
          exampleSetFlag: true
        hostname:
          type: string
          description: ACI hostname or IP address
          example: 10.0.0.1
          exampleSetFlag: true
        id:
          type: string
          readOnly: true
          exampleSetFlag: true
        lastUpdate:
          type: string
          example: Oct 25, 2024 1:40 PM
          exampleSetFlag: true
        name:
          type: string
          description: ACI name
          example: ACI1
          exampleSetFlag: true
        receivedMappings:
          type: integer
          format: int32
          example: 1000
          exampleSetFlag: true
        sgtRanges:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/SgtRange'
            exampleSetFlag: false
        sharedMappings:
          type: integer
          format: int32
          example: 2000
          exampleSetFlag: true
        state:
          type: string
          description: Corresponding actions will change the state of the connection
          readOnly: true
          exampleSetFlag: true
          enum:
            - CONNECTED
            - CONNECTING
            - DELETE_ERROR
            - DELETING
            - DISCONNECTED
            - ERROR
            - SUSPENDED
            - UNDEPLOYED
        syncedEPG:
          type: integer
          description: Synced EPGs/ESGs
          format: int32
          example: 5
          exampleSetFlag: true
      description: ACI connection summary
      exampleSetFlag: false
    AciConnectionSummaryResponse:
      title: AciConnectionSummaryResponse
      type: object
      properties:
        response:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionSummary'
            exampleSetFlag: false
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    AciTenantContract:
