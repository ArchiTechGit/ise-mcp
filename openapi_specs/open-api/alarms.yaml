      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeAlarmsByIdsResponse'
                exampleSetFlag: false
        '201':
          description: Created
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/instances/acknowledge/acknowledgeByInstanceIds:
    put:
      tags:
        - Alarm Instances Services
      summary: Acknowledge alarm instances
      description: >-
        This API acknowledges a list of alarm instances by setting their visited
        status.
      operationId: acknowledgeAlarmInstances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeInstancesRequest'
              exampleSetFlag: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeInstancesResponse'
                exampleSetFlag: false
        '201':
          description: Created
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/instances/{instanceId}:
    get:
      tags:
        - Alarm Instances Services
      summary: Retrieve specific alarm instance
      description: This API retrieves specific alarm instances present in the system.
      operationId: getAlarmInstancesById
      parameters:
        - name: instanceId
          in: path
          description: Get Alarm Instance by Id.
          required: true
          style: simple
          schema:
            type: string
            exampleSetFlag: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmInstanceResponseWrapper'
                exampleSetFlag: false
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alarm Id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/instances/{page}/{size}:
    get:
      tags:
        - Alarm Instances Services
      summary: Retrieve all alarm instances
      description: This API retrieves all alarm instances present in the system.
      operationId: getAllAlarmInstances
      parameters:
        - name: page
          in: path
          description: Page number for pagination (default is 1)
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: size
          in: path
          description: Number of items per page for pagination (default is 50)
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: from
          in: header
          description: >-
            Start date for filtering alarm instances (ISO 8601 UTC format, e.g.,
            "2025-09-15T10:00:00.000Z")
          required: false
          schema:
            type: string
            exampleSetFlag: true
        - name: to
          in: header
          description: >-
            End date for filtering alarm instances (ISO 8601 UTC format, e.g.,
            "2025-09-15T23:59:59.999Z")
          required: false
          schema:
            type: string
            exampleSetFlag: true
        - name: severity
          in: header
          description: >-
            Severity level for filtering alarm instances (e.g., "Critical",
            "Warning", "Info")
          required: false
          schema:
            type: string
            exampleSetFlag: true
            enum:
              - Critical
              - Info
              - Warning
        - name: iseNode
          in: header
          description: ISE Node name for filtering alarm instances
          required: false
          schema:
            type: string
            exampleSetFlag: true
        - name: keyword
          in: header
          description: keyword for global search
          required: false
          schema:
            type: string
            exampleSetFlag: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmInstancePaginatedResponseWrapper'
                exampleSetFlag: false
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alarm Id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/primingData:
    get:
      tags:
