        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/summary/groupByAlarms:
    get:
      tags:
        - Alarm Instances Services
      summary: Alarms summary grouped by Alarm Id
      description: >-
        This API retrieves a summary of alarm instances including counts grouped
        by Alarms.
      operationId: getAlarmInstancesSummary
      parameters:
        - name: from
          in: header
          description: >-
            Start date for filtering alarm instances (ISO 8601 UTC format, e.g.,
            "2025-09-15T10:00:00.000Z")
          required: false
          schema:
            type: string
            exampleSetFlag: true
        - name: to
          in: header
          description: >-
            End date for filtering alarm instances (ISO 8601 UTC format, e.g.,
            "2025-09-15T23:59:59.999Z")
          required: false
          schema:
            type: string
            exampleSetFlag: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                exampleSetFlag: true
                items:
                  $ref: '#/components/schemas/AlarmSummary'
                  exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/{alarmId}/instances/{page}/{size}:
    get:
      tags:
        - Alarm Instances Services
      summary: Retrieve alarm instances by Alarm ID
      description: This API retrieves all alarm instances for a specific alarm ID.
      operationId: getAlarmInstancesByType
      parameters:
        - name: alarmId
          in: path
          description: The alarm ID to filter instances
          required: true
          style: simple
          schema:
            type: string
            exampleSetFlag: true
        - name: page
          in: path
          description: Page number for pagination (default is 1)
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: size
          in: path
          description: Number of items per page for pagination (default is 50)
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: from
          in: header
          description: >-
            Start date for filtering alarm instances (ISO 8601 UTC format, e.g.,
            "2025-09-15T10:00:00.000Z")
          required: false
          schema:
            type: string
            exampleSetFlag: true
        - name: to
          in: header
          description: >-
            End date for filtering alarm instances (ISO 8601 UTC format, e.g.,
