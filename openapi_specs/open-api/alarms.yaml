openapi: 3.0.3
info:
  title: Cisco ISE API - Alarms
  version: 1.0.0
servers:
  - url: https://10.104.241.219:443
    description: Inferred Url
tags:
  - name: alarms-api-controller
    description: the alarms API
paths:
  /api/v1/alarms:
    get:
      tags:
        - AlarmConfigurations Services
      summary: Retrieve all the Alarm Rules
      description: This API retrieves all the Alarm Rules present in the system.
      operationId: getAllAlarms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmRuleListResponseWrapper'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
    put:
      tags:
        - AlarmConfigurations Services
      summary: Update the Alarms Rules in Bulk
      description: >-
        This API updates the Alarms Rule status, notification and suppression
        for multiple Alarms.
      operationId: updateAlarmRules
      requestBody:
        content:
          application/json:
            schema:
              type: array
              exampleSetFlag: true
              items:
                $ref: '#/components/schemas/AlarmRuleUpdateRequest'
                exampleSetFlag: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmRuleUpdateResponseWrapper'
                exampleSetFlag: false
        '201':
          description: Created
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alarm Id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
    post:
      tags:
        - AlarmConfigurations Services
      summary: Create a new Alarm Rule
      description: This API creates a new Alarm Rule.
      operationId: createAlarms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRuleRequest'
              exampleSetFlag: false
      responses:
        '200':
          description: Unexpected Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmRuleResponseWrapper1'
                exampleSetFlag: false
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Alarm with the same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
    delete:
      tags:
        - AlarmConfigurations Services
      summary: Bulk Remove Alarm Rules
      description: This API removes multiple Alarm Rules for the given list of IDs.
      operationId: removeAlarms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmIdsRequest'
              exampleSetFlag: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAlarmRuleResponseWrapper'
                exampleSetFlag: false
        '204':
          description: No Content
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alarm Id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/details-report/definitions:
    get:
      tags:
        - Alarm details
      summary: Retrieve Report Definitions with Sections
      description: >-
        Returns static report definition data containing report names and their
        associated sections with IDs and titles.
      operationId: getReportDefinitions
