      title: ImportExecutionResponse
      required:
        - status
      type: object
      properties:
        failureCount:
          type: integer
          description: Number of failed import items (present when status is error)
          format: int32
          example: 3
          exampleSetFlag: true
        importSummary:
          type: array
          description: Detailed summary of all import items (present when status is error)
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/ImportSummaryItem'
            exampleSetFlag: false
        progress:
          type: integer
          description: Progress percentage (only present when status is in-progress)
