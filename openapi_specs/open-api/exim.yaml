  /api/v1/exim/import/posture/complete-import:
    post:
      tags:
        - Import-Posture
      summary: Complete import setup from repository
      description: >-
        Simplified import API that retrieves the file from a repository and
        performs the import.  **What this API does:** 1. Retrieves the ZIP file
        from the specified repository 2. Auto-configure import details with
        default values (replace mode) 3. Allows optional policy-specific other
        condition mappings 4. Executes the import process  **Request
        Parameters:** - `fileName` (REQUIRED): Name of the file in the
        repository - `repoName` (REQUIRED): Repository name where the file is
        located - `encryptionKey` (OPTIONAL): Encryption key if the file is
        encrypted - `policyConditionMappings` (OPTIONAL): Array of
        policy-to-condition mappings  **Returns:** Success response with the
        import execution status.  **Note:** To check the detailed response, use
        the `/import/posture/status` endpoint. 
      operationId: executeCompleteImportWithFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteImportRequest'
              exampleSetFlag: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExecutionResponse'
                exampleSetFlag: false
        '201':
          description: Created
        '400':
