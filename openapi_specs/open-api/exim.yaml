          exampleSetFlag: true
        fileName:
          type: string
          description: File name to import
          exampleSetFlag: true
        importFrom:
          type: string
          description: Source of import - local file or repository
          exampleSetFlag: true
          enum:
            - local
            - repository
        importMethod:
          type: string
          exampleSetFlag: true
          enum:
            - replace
            - update
        message:
          type: string
          description: Error or informational message about the import
          exampleSetFlag: true
