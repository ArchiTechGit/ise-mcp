          exampleSetFlag: true
        fileName:
          type: string
          description: Name of the file in the repository to import
          exampleSetFlag: true
        policyConditionMappings:
          type: array
          description: Array of policy to other condition mappings
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/CompleteImportRequestPolicyConditionMappings'
            exampleSetFlag: false
        repoName:
          type: string
          description: Repository name where the import file is located
          exampleSetFlag: true
      description: Request body for the complete posture policy import from repository API.
      exampleSetFlag: false
    CompleteImportRequestPolicyConditionMappings:
      title: CompleteImportRequestPolicyConditionMappings
      required:
        - otherConditions
        - policyName
      type: object
      properties:
        otherConditions:
          type: string
          description: Other conditions associated with this policy
          exampleSetFlag: true
        policyName:
          type: string
          description: Name of the policy
          exampleSetFlag: true
      description: Mapping between a posture policy and additional conditions.
      exampleSetFlag: false
    ConditionConflict:
      title: ConditionConflict
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ConflictAction'
          exampleSetFlag: true
