          type: array
          description: Names of attributes that are in conflict for this condition.
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
        condition:
          type: array
          description: List of conflicting condition objects.
          exampleSetFlag: true
          items:
            type: object
            additionalProperties:
              type: object
              exampleSetFlag: false
            exampleSetFlag: false
        id:
          type: string
          description: Condition ID with conflict
          exampleSetFlag: true
        isValidate:
          type: boolean
          description: >-
            A flag which specifies whether to enable or disable validation
            during conflict resolution. When true, validation is performed. When
            false, validation is skipped. 
          example: false
          exampleSetFlag: true
        name:
          type: string
          description: Condition name
          exampleSetFlag: true
        policy:
          type: array
          description: List of policies and requirements where the condition is used.
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/PolicyWithRequirements'
            exampleSetFlag: false
      description: Conflict details for a posture condition.
      exampleSetFlag: false
    ConditionConflictResolution:
