openapi: 3.0.3
info:
  title: Cisco ISE API - Rbac Catalog
  version: 1.0.0
servers:
  - url: https://10.86.189.217:443
    description: Inferred Url
tags:
  - name: rbac-api-controller
    description: the rbac API
paths:
  /api/v1/rbac/admin-group:
    get:
      tags:
        - Admin Groups
      summary: Retrieve all admin groups available in Cisco ISE
      description: Get admin groups API will be used to view Cisco ISE  network admin groups
      operationId: listAllAdminGroups
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          style: form
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: size
          in: query
          description: Number of objects returned per page
          required: false
          style: form
          schema:
            type: integer
            format: int32
            exampleSetFlag: true
        - name: sort
          in: query
          description: sort type - asc or desc
          required: false
          style: form
          schema:
            type: string
            exampleSetFlag: true
            enum:
              - asc
              - desc
        - name: sortBy
          in: query
          description: sort column by which objects needs to be sorted
          required: false
          style: form
          schema:
            type: string
            exampleSetFlag: true
        - name: filter
          in: query
          description: '<div> <style type="text/css" scoped> .apiServiceTable td, .apiServiceTable th { padding: 5px 10px !important; text-align: left; } </style> <span> <b>Simple filtering</b> should be available through the filter query string parameter. The structure of a filter is a triplet of field operator and value separated with dots. More than one filter can be sent. The logical operator common to ALL filter criteria will be by default AND, and can be changed by using the <i>"filterType=or"</i> query string parameter. Each resource Data model description should specify if an attribute is a filtered field. </span> <br /> <table class="apiServiceTable"> <thead> <tr> <th>OPERATOR</th> <th>DESCRIPTION</th> </tr> </thead> <tbody> <tr> <td>EQ</td> <td>Equals</td> </tr> <tr> <td>NEQ</td> <td>Not Equals</td> </tr> <tr> <td>GT</td> <td>Greater Than</td> </tr> <tr> <td>LT</td> <td>Less Then</td> </tr> <tr> <td>STARTSW</td> <td>Starts With</td> </tr> <tr> <td>NSTARTSW</td> <td>Not Starts With</td> </tr> <tr> <td>ENDSW</td> <td>Ends With</td> </tr> <tr> <td>NENDSW</td> <td>Not Ends With</td> </tr> <tr> <td>CONTAINS</td> <td>Contains</td> </tr> <tr> <td>NCONTAINS</td> <td>Not Contains</td> </tr> </tbody> </table> </div>'
          required: false
          style: form
          explode: true
          schema:
            type: string
            exampleSetFlag: true
        - name: filterType
          in: query
          description: The logical operator common to ALL filter criteria will be by default AND, and can be changed by using the parameter
          required: false
          style: form
          schema:
            type: string
            exampleSetFlag: true
            enum:
              - AND
              - OR
      responses:
        '200':
          description: Response object with all the admin groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupResponse'
                exampleSetFlag: false
        '400':
          description: Bad Request for this specified resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - BasicAuth: []
    post:
      tags:
        - Admin Groups
      summary: Create admin group in Cisco ISE
      description: Post admin group API will be used to create Cisco ISE network admin group <ul> <li><strong>name</strong> - Admin group name.</li> <li><strong>description</strong> - Admin group description.</li> <li><strong>isExternal</strong> -</li> <ul> <li>If <strong>isExternal</strong> is set to true <ul> <li>It is mandatory to pass values in externalGroups array for AD group association.</li> </ul> </li> <li>If <strong>isExternal</strong> is set to false <ul> <li>External group association is not allowed.</li> </ul> </li> </ul> <li><strong>externalGroups</strong> - An array of external AD groups associated with the admin group.</li> <li><strong>rbacUsers</strong> - An array of admin users associated with the admin group.</li> </ul>
      operationId: createAdminGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenApiAdminGroup'
              exampleSetFlag: false
      responses:
        '200':
          description: Successfully created admin group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
        '201':
          description: Created
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Group already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
      security:
        - BasicAuth: []
  /api/v1/rbac/admin-group/reset/bulk:
    post:
