services:
  # PostgreSQL database for credentials and audit logs
  ise_mcp_postgres:
    image: postgres:15-alpine
    container_name: ise_mcp_postgres
    environment:
      POSTGRES_DB: ise_mcp
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "${POSTGRES_PORT:-15436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d ise_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ise-mcp-network
    restart: unless-stopped

  # Certificate initialization service (generates self-signed certs on first startup)
  ise_mcp_cert_init:
    image: alpine:latest
    container_name: ise_mcp_cert_init
    command: sh /scripts/generate-certs.sh
    volumes:
      - certs:/app/certs
      - ./scripts:/scripts:ro
    environment:
      - CERT_DIR=/app/certs
      - CERT_DAYS=${CERT_DAYS:-365}
      - CERT_SERVER_IP=${CERT_SERVER_IP:-}
      - CERT_CN=${CERT_CN:-ise-mcp}
      - CERT_ORG=${CERT_ORG:-ISE MCP}
    networks:
      - ise-mcp-network

  # Cisco ISE MCP Server
  # Connected to external bridge network for container-to-container communication
  ise_mcp_mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ise_mcp_mcp_server
    depends_on:
      ise_mcp_postgres:
        condition: service_healthy
    networks:
      - ise-mcp-network
    environment:
      # Database (use service name on Docker network)
      DATABASE_URL: postgresql://mcp_user:changeme@ise_mcp_postgres:5432/ise_mcp

      # Cisco ISE Connection
      ISE_HOST_URL: ${ISE_HOST_URL:-https://192.168.70.101:9060}
      ISE_USERNAME: ${ISE_USERNAME:-ersadmin}
      ISE_PASSWORD: ${ISE_PASSWORD}
      ISE_VERIFY_SSL: ${ISE_VERIFY_SSL:-false}
      ISE_CTS_PORT: ${ISE_CTS_PORT:-9063}

      # Security
      EDIT_MODE_ENABLED: ${EDIT_MODE_ENABLED:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-lGczu6Yzd2IrRrcJF3cOS8BsAOO6R-1761BRDusbCuM=}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-me-in-production}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./openapi_specs:/app/openapi_specs:ro
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Initializing database...' &&
        python scripts/init_database.py &&
        echo 'Starting ISE MCP server...' &&
        python src/main.py
      "

  # FastAPI Web API Backend (HTTPS)
  # Connected to external bridge network for service discovery via DNS
  ise_mcp_web_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ise_mcp_web_api
    depends_on:
      ise_mcp_postgres:
        condition: service_healthy
      ise_mcp_cert_init:
        condition: service_completed_successfully
    networks:
      - ise-mcp-network
    ports:
      - "${WEB_API_PORT:-8448}:${WEB_API_PORT:-8448}"
      - "${INTERNAL_HTTP_PORT:-7104}:${INTERNAL_HTTP_PORT:-7104}"
    environment:
      # Database (use service name on Docker network)
      DATABASE_URL: postgresql://mcp_user:changeme@ise_mcp_postgres:5432/ise_mcp

      # Security
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-lGczu6Yzd2IrRrcJF3cOS8BsAOO6R-1761BRDusbCuM=}

      # MCP Remote Access (optional - leave empty for open access)
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}

      # SSL/TLS Configuration
      SSL_ENABLED: "true"
      SSL_CERTFILE: /app/certs/server.crt
      SSL_KEYFILE: /app/certs/server.key
      WEB_API_PORT: ${WEB_API_PORT:-8448}
      INTERNAL_HTTP_PORT: ${INTERNAL_HTTP_PORT:-7104}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./openapi_specs:/app/openapi_specs:ro
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
      - certs:/app/certs:ro
    restart: unless-stopped
    command: ["sh", "/app/scripts/start-web-api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:${WEB_API_PORT:-8448}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js Web UI (HTTPS)
  ise_mcp_web_ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: ise_mcp_web_ui
    depends_on:
      - ise_mcp_web_api
      - ise_mcp_cert_init
    networks:
      - ise-mcp-network
    ports:
      - "${WEB_UI_PORT:-7447}:${WEB_UI_PORT:-7447}"
    environment:
      # Backend API URL for server-side proxying over Docker network
      - BACKEND_API_URL=http://ise_mcp_web_api:${INTERNAL_HTTP_PORT:-7104}
      # SSL/TLS Configuration
      - SSL_ENABLED=true
      - SSL_CERTFILE=/app/certs/server.crt
      - SSL_KEYFILE=/app/certs/server.key
      # External HTTPS port
      - PORT=${WEB_UI_PORT:-7447}
      # Internal Next.js port (configurable to avoid conflicts with other services like Grafana)
      - INTERNAL_PORT=${WEB_UI_INTERNAL_PORT:-7104}
      # Allow self-signed certificates for internal communication
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - certs:/app/certs:ro
    command:
      - sh
      - -c
      - |
        # $$ escapes the $ so Compose passes it through to the container shell.
        # A single $ would be substituted from the HOST environment at parse
        # time -- where BACKEND_API_URL is unset -- and the guard would always
        # fail despite the container env var below being set correctly.
        test -n "$$BACKEND_API_URL" || { echo "ERROR: BACKEND_API_URL is required"; exit 1; }
        node https-server.js
    restart: unless-stopped

networks:
  ise-mcp-network:
    external: true
    name: ${DOCKER_EXTERNAL_NETWORK:-openshell-cluster-nemoclaw}

volumes:
  postgres_data:
    driver: local
  certs:
    name: ise-mcp-certs
    driver: local
